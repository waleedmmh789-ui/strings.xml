name: Build APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # البحث عن أي ملف ZIP وفك ضغطه
    - name: Unzip Project and Locate Gradlew
      run: |
        ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Found $ZIP_FILE. Extracting..."
          unzip "$ZIP_FILE" -d ./unzipped_project
          GRADLEW_PATH=$(find ./unzipped_project -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew not found inside the zip file!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found gradlew in: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
        else
          echo "No zip file found in repository root!"
          exit 1
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      run: |
        echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Grant execute permission for gradlew
      run: chmod +x ${{ env.PROJECT_DIR }}/gradlew

    - name: Build APK
      working-directory: ${{ env.PROJECT_DIR }}
      run: ./gradlew assembleRelease

    - name: Build AAB
      working-directory: ${{ env.PROJECT_DIR }}
      run: ./gradlew bundleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: App-Release-APK
        path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: App-Release-AAB
        path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab
