name: Build APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Found $ZIP_FILE. Extracting..."
          unzip "$ZIP_FILE" -d ./unzipped_project
          # البحث عن مجلد app لتحديد مسار المشروع
          APP_DIR=$(find ./unzipped_project -type d -name "app" | head -n 1)
          if [ -z "$APP_DIR" ]; then
             echo "Error: app folder not found!"
             exit 1
          fi
          PROJECT_DIR=$(dirname "$APP_DIR")
          echo "Project Directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
        else
          echo "No zip file found."
          exit 1
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # إنشاء ملف gradlew إذا لم يكن موجوداً
    - name: Generate Gradlew if missing
      working-directory: ${{ env.PROJECT_DIR }}
      run: |
        if [ ! -f "gradlew" ]; then
          echo "gradlew missing. Generating..."
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Setup Android SDK
      run: |
        echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Build APK
      working-directory: ${{ env.PROJECT_DIR }}
      run: ./gradlew assembleDebug

    - name: Build AAB
      working-directory: ${{ env.PROJECT_DIR }}
      run: ./gradlew bundleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: App-Debug-APK
        path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: App-Debug-AAB
        path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/debug/*.aab
